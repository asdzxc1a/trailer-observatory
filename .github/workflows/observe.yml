name: Trailer Observatory
run-name: ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      manifest_b64:
        description: Public YouTube trailer URL/window manifest only
        required: true
        type: string
      job_id:
        description: Owned control-plane identifier
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: trailer-observatory-public-worker
  cancel-in-progress: false
jobs:
  observe:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    env:
      HF_HOME: /tmp/trailer-observatory-hf-cache
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      MANIFEST_B64: ${{ inputs.manifest_b64 }}
      GH_TOKEN: ${{ github.token }}
      OBSERVATORY_JOB_ID: ${{ inputs.job_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-worker.txt
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /tmp/trailer-observatory-hf-cache
          key: smolvlm256-7e3e67ed-v1
      - name: Install CPU worker dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-worker.txt
          ffmpeg -version
      - name: Observe exact declared windows remotely
        run: python worker.py --out evidence --shard ${{ matrix.shard }} --shards 2 --emit-logs
